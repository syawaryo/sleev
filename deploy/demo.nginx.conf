server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /demo/manifest.json {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
